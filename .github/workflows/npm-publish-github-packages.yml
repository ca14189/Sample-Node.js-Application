name: Deploy Node App to EC2

on:
  push:
    branches:
      - master  # Change to "main" if your repo uses the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          debug: true
          script: |
            # Go to home directory
            cd /home/ubuntu

            # Remove old app if exists
            rm -rf my-app

            # Clone latest code
            git clone https://github.com/ca14189/Sample-Node.js-Application.git my-app

            # Go into the app folder
            cd my-app

            # Install dependencies
            npm install

            # Stop old PM2 process if exists
            pm2 stop my-app || true

            # Start the app with PM2
            pm2 start server.js --name my-app

            # Save PM2 process list (optional, for reboot persistence)
            pm2 save
