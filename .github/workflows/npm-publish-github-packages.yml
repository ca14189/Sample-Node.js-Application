name: Node.js CI/CD to EC2

on:
  push:
    branches: [master]  # 👈 Only triggers on push to 'master'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test || echo "No tests yet, continuing..."
        # 👆 prevents workflow failure if no tests are defined

      - name: Deploy to EC2
        if: success()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ubuntu/my-app  # ✅ replace with your actual app path on EC2
            git pull origin master  # ✅ match the branch you're pushing to
            npm install
            pm2 restart your-app || pm2 start server.js --name your-app
